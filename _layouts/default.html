<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
	<head>
		<meta charset="utf-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		{% seo %}
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
		<link rel="stylesheet" href="{{ 'assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}" />
		<script src="{{ '/assets/js/scale.fix.js' | relative_url }}"></script>
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes" />
		<meta name="google-site-verification" content="jSueJx3jsZPBZAXLoa0FslQH0cTCV6zv7iYh72gH0aA" />
		<link rel="icon" href="https://keiza.al/assets/img/icon.png"  type="image/x-icon" />
		<script>
			document.addEventListener("DOMContentLoaded", () => {
				// Set current year
				document.getElementById("currentYear").textContent = new Date().getFullYear();
			
				// Show modal based on URL parameter
				const params = new URLSearchParams(window.location.search);
				const source = params.get("from");
				const modals = {
					404: "popup404",
					kzo: "popupKZO"
				};
			
				if (modals[source]) {
					const modalElement = document.getElementById(modals[source]);
					if (modalElement) {
						new bootstrap.Modal(modalElement).show();
						history.replaceState({}, "", window.location.pathname);
					}
				}
			});
		</script>
	</head>
	<body>
		<div class="container-fluid text-light">
		    <div class="row">
				<!-- Popup Component -->
				<div class="modal fade" id="popup404" tabindex="-1" aria-labelledby="popup404Title" aria-hidden="true">
				  <div class="modal-dialog modal-dialog-centered modal-lg" style="max-width: 500px;">
				    <div class="modal-content bg-black text-light">
						{% include popups/404.html %}
				    </div>
				  </div>
				</div>
				<div class="modal fade" id="popupKZO" tabindex="-1" aria-labelledby="popupTitle" aria-hidden="true">
				  <div class="modal-dialog modal-dialog-centered modal-lg">
				    <div class="modal-content bg-black text-light">
						{% include popups/kzo.html %}
				    </div>
				  </div>
				</div>
				{% include navigation.html %}
		        <!-- Main Content -->
		        <main class="col col-12 col-md-9 col-xl-10 p-0 ms-md-auto">
		            <div class="container py-4 pb-5">
					<header class="d-none d-md-block mb-4 w-75 mx-auto">
						<img class="img-fluid" alt="Keizaal: A Simple Modlist" src="http://keiza.al/assets/img/banner.png"/>
		            </header>
		            <article id="content">
						<div id="content" class="image-{{ page.image_align | default: 'left' }}">
							{% if page.title and page.hide_title != true %}
							<h1>{{ page.title }}</h1>
							<hr>
							{% endif %}
							{{ content }}
				            </article>
						</div>	
					</div>
		        </main>
		    </div>
		</div> 
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
	</body>
</html>
