<script>
  document.addEventListener("DOMContentLoaded", () => {
    // Set current year
    document.getElementById("currentYear").textContent = new Date().getFullYear();
  
    // Show modal based on URL parameter
    const params = new URLSearchParams(window.location.search);
    const source = params.get("from");
    const modals = {
      404: "popup404",
      kzo: "popupKZO"
    };
  
    if (modals[source]) {
      const modalElement = document.getElementById(modals[source]);
      if (modalElement) {
        new bootstrap.Modal(modalElement).show();
        history.replaceState({}, "", window.location.pathname);
      }
    }
  
    // Show image preview modal
    document.querySelectorAll('#article-content img').forEach(img => {
      img.dataset.bsToggle = 'modal';
      img.dataset.bsTarget = '#imagePreviewModal';
    });
  
    const imagePreviewModal = document.getElementById('imagePreviewModal');
  
    if (imagePreviewModal) {
      imagePreviewModal.addEventListener('show.bs.modal', function (event) {
        const triggerImage = event.relatedTarget;
        const modalImage = imagePreviewModal.querySelector('#modalPreviewImage');
  
        if (triggerImage && modalImage) {
          modalImage.src = triggerImage.src;
          modalImage.alt = triggerImage.alt;
        }
      });
    }
  });
</script>
<!-- End Scripts include -->
